# Peermate on a server. Mongo is hosted (Atlas, from MONGODB_URL in .env); MinIO and
# Chroma run here, reachable only from inside this network — nothing about them needs
# to be on the public internet, and a publicly addressable object store is a liability
# rather than a feature.
#
#   docker compose -f docker-compose.deploy.yml up -d --build
#   docker compose -f docker-compose.deploy.yml logs -f app    # pairing code lands here

services:
  app:
    build: .
    env_file: .env
    environment:
      # Service names, not the public hostnames — traffic never leaves the host, so
      # there is no TLS to terminate and no certificate to keep alive.
      CHROMA_URL: http://chroma:8000
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: 'false'
      WHATSAPP_AUTH_DIR: /app/auth_state
      # Which bot number this container is. One shard, one number, one auth volume.
      SHARD_ID: default
      ENVIRONMENT: production
    volumes:
      # Losing this means re-pairing by hand from the bot's phone. Back it up.
      - auth_state:/app/auth_state
    ports:
      - '3000:3000'
    depends_on:
      - minio
      - chroma
    # Chroma and MinIO take a few seconds to accept connections and the app connects
    # to both at boot. Rather than health-gate the start — a healthcheck naming a
    # binary the image lacks blocks it for ever — let it exit and come back.
    restart: unless-stopped
    deploy:
      # Two processes against one WhatsApp session desynchronise the Signal ratchet
      # and every student sees "Waiting for this message" with no way back. This
      # stays 1 for ever: capacity comes from adding shards, never from replicas.
      replicas: 1
      update_config:
        order: stop-first

  render-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: 'false'
      SHARD_ID: default
      RENDER_VIDEO_ENABLED: 'true'
    depends_on:
      - minio
    restart: unless-stopped

  # Adding a second bot number:
  #
  #   app-beta:
  #     <<: *app-common          # or copy the block above
  #     environment:
  #       SHARD_ID: beta
  #       WHATSAPP_AUTH_DIR: /app/auth_state
  #     volumes:
  #       - auth_state_beta:/app/auth_state   # its OWN volume, never the shared one
  #     ports:
  #       - "3001:3000"
  #
  # Each shard pairs its own number, reads only the groups that number is in, and
  # messages only the students who wrote to it. They share Mongo, MinIO and Chroma;
  # they must never share auth_state. A banned number then costs one shard rather
  # than every student's conversation.

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/data
    restart: unless-stopped

volumes:
  auth_state:
  minio_data:
  chroma_data:
