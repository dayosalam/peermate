name: peermate-whatsapp

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build:
      context: .
    labels:
      com.peermate.release: peermate-full-2026-09-14
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      PORT: "3000"
      MONGODB_URL: mongodb://mongo:27017
      CHROMA_URL: http://chroma:8000
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
      SEARCH_BACKEND: chroma
      SHARD_ID: default
      WHATSAPP_AUTH_DIR: /app/auth_state
    volumes:
      - whatsapp_auth:/app/auth_state
    ports:
      - "127.0.0.1:3011:3000"
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    init: true
    mem_limit: 512m
    stop_grace_period: 90s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging: *default-logging

  mongo:
    image: mongo:7.0.30@sha256:da7bfd48ee2e48e6d0a60757f14eb26b0cb2929691ef9eded0f8cff0c77a8f9a
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  chroma:
    image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    volumes:
      - chroma_data:/data
    restart: unless-stopped
    logging: *default-logging

  minio:
    # Docker Hub no longer distributes MinIO. This is its final community binary
    # release, pinned to the immutable Quay digest for this one-month pilot.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
    volumes:
      - media_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

volumes:
  whatsapp_auth:
  mongo_data:
  chroma_data:
  media_data:
